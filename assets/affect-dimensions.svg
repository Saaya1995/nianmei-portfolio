<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" role="img"><title>具身情感交互的四个设计维度</title><rect width="680" height="540" rx="10" fill="#f5f7f2"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#28392e"><text x="26" y="36" font-size="22" font-weight="650">用户参与</text><text x="26" y="75" font-size="17">无意识采集</text><path d="M196 69 H484 m-6 -4 6 4 -6 4 M202 65 l-6 4 6 4" fill="none" stroke="#78927e" stroke-width="2"/><text x="653" y="75" text-anchor="end" font-size="17">有意识操作</text><text x="26" y="114" fill="#526156" font-size="16">需要减轻注意负担，还是邀请用户主动表达？</text><path d="M26 133 H654" stroke="#d6ded3"/><text x="26" y="166" font-size="22" font-weight="650">理论依据</text><text x="26" y="205" font-size="17">常识与隐喻</text><path d="M196 199 H484 m-6 -4 6 4 -6 4 M202 195 l-6 4 6 4" fill="none" stroke="#78927e" stroke-width="2"/><text x="653" y="205" text-anchor="end" font-size="17">经验证的理论</text><text x="26" y="244" fill="#526156" font-size="16">哪些设计可以探索，哪些机制需要研究证据？</text><path d="M26 263 H654" stroke="#d6ded3"/><text x="26" y="296" font-size="22" font-weight="650">交互显著性</text><text x="26" y="335" font-size="17">低调、私密</text><path d="M196 329 H484 m-6 -4 6 4 -6 4 M202 325 l-6 4 6 4" fill="none" stroke="#78927e" stroke-width="2"/><text x="653" y="335" text-anchor="end" font-size="17">显眼、易感知</text><text x="26" y="374" fill="#526156" font-size="16">用户希望身边的人注意到这次互动吗？</text><path d="M26 393 H654" stroke="#d6ded3"/><text x="26" y="426" font-size="22" font-weight="650">情感表达</text><text x="26" y="465" font-size="17">开放、模糊</text><path d="M196 459 H484 m-6 -4 6 4 -6 4 M202 455 l-6 4 6 4" fill="none" stroke="#78927e" stroke-width="2"/><text x="653" y="465" text-anchor="end" font-size="17">明确、具体</text><text x="26" y="504" fill="#526156" font-size="16">哪些感受由用户解释，哪些反馈需要清晰传达？</text></g></svg>